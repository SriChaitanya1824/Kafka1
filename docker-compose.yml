services:
  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
    healthcheck: { test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"], interval: 10s, timeout: 5s, retries: 5 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 5 }
  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    env_file: .env.example
    environment:
      MONGO_URI: mongodb://mongodb:27017/notification_platform
      REDIS_URL: redis://redis:6379
    ports: ["4000:4000"]
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    env_file: .env.example
    environment:
      MONGO_URI: mongodb://mongodb:27017/notification_platform
      REDIS_URL: redis://redis:6379
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  mongo_data:
